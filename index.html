<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Farm Ultimate - AI Bioacoustic Classifier</title>
  <link rel="stylesheet" href="style.css" />
  <!-- TensorFlow.js & Speech Commands Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
</head>
<body>

  <!-- Cinematic 60 FPS Multi-Layer Canvas Engine -->
  <canvas id="farm-canvas"></canvas>

  <div class="app-wrapper">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-badge"><span>Machine Learning</span> Sounds </div>
      <h1>Night Farm Ultimate</h1>
      <p class="subtitle">Animal sound recognition system</p>
    </header>

    <!-- Control Center -->
    <div class="control-deck">
      <button id="start-btn" onclick="init()">
        <div class="btn-glow"></div>
        <div class="btn-ripple"></div>
        <span class="btn-icon">🎙️</span>
        <span class="btn-text">Initialize Mic</span>
      </button>

      <div class="status-indicator">
        <span class="pulse-ring"></span>
        <span class="pulse-dot"></span>
        <span id="status-text">System Standby</span>
      </div>
    </div>

    <!-- Live Spectrum Analyzer -->
    <div class="panel-card analyzer-card">
      <div class="panel-header">
        <span class="panel-title">Real-Time Frequency Spectrogram</span>
        <div class="fps-badge" id="fps-counter">60 FPS</div>
      </div>
      <div class="visualizer-container" id="visualizer-container">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Animal Classification Grid -->
    <div class="grid-section">
      <div class="section-title">Active Bioacoustic Classes</div>
      <div id="label-container" class="animal-grid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
